<h3> simone weil: chance </h3>

<p class = "prose">
    The beings I love are creatures. They were born by chance. My meeting with them was also by chance. They will die. What they think, do and say is limited and is a mixture of good and evil. <br>
    I have to know this with all my soul and not love them the less. <br>
    I have to imitate God who infinitely loves finite things in that they are finite things.
</p>

<p class = "prose">
    We want everything which has a value to be eternal. Now everything which has a value is the product of a meeting, lasts throughout this meeting and ceases when those things which met are separated. That is the central idea of Buddhism (the thought of Heraclitus). It leads straight to God. <br>
    Meditation on chance which led to the meeting of my father and mother is even more salutary than meditation on death. <br>
    Is there a single thing in me of which the origin is not to be found in that meeting? Only God. And yet again, my thought of God had its origin in that meeting.
</p>

<p class = "prose">
    Stars and blossoming fruit-trees: utter permanence and extreme fragility give an equal sense of eternity.
</p>

<p>

<p>
    sappho ran so dolly parton's jolene could walk &mdash; but really what do you even say: imagine being so gay you get not one but two words for homosexuality named after you, not to mention inventing the word "bittersweet" to describe being gay and in love (lesbian yearning est. c. 600 BCE). "eros as deferred, defied, obstructed, hungry, organized around a radiant absence &mdash; ... eros as lack", you really must read eros the bitterweet.
</p>

<p>
    of sappho's work only one "ode to aphrodite" comes to us complete, but this fragment as an artifact is to me perfect. imagine a fusty papyrologist decoding this for the first time in some cambridge library, catching his breath at <em>thin / fire is racing under skin</em>, getting to <em>But all is to be dared, because...</em> and reading right up to a raggedy edge torn off by some hungry mouse centuries earlier. carson's translation is unsurprisingly spectacular, she leans in to the gaps in the fragments, marking missing words &amp; lines with brackets and making them part of the text &mdash; reading it feels like reaching for a something just out of reach, not unlike desire...
</p>

<h3> lydia davis: this condition </h3>

<p class = "prose">
    In this condition: stirred not only by men but by women, fat and thin, naked and clothed; by teenagers and children in latency; by animals such as horses and dogs; by certain vegetables such as carrots, zucchinis, eggplants, and cucumbers; by fruits such as melons, grapefruits, and kiwis; by certain plant parts such as petals, sepals, stamens, and pistils; by the bare arm of a wooden chair, a round vase holding flowers, a little hot sunlight, a plate of pudding, a person entering a tunnel in the distance, a puddle of water, a hand alighting on a smooth stone, a hand alighting on a bare shoulder, a naked tree limb; by anything curved, bare, and shining, as the limb or bole of a tree; by any touch, as the touch of a stranger handling money; by anything round and freely hanging, as tassels on a curtain, chestnut burrs on a twig in spring, a wet tea bag on its string; by anything glowing, as a hot coal; anything soft or slow, as a cat rising from a chair; anything smooth and dry, as a stone, or warm and glistening; anything sliding, anything sliding back and forth; anything sliding in and out with an oiled surface, as certain machine parts; anything of a certain shape, like the state of Florida; anything pounding, anything stroking; anything bolt upright, anything horizontal and gaping, as a certain sea anemone; anything warm, anything wet, anything wet and red, anything turning red, as the sun at evening; anything wet and pink; anything long and straight with a blunt end, as a pestle; anything coming out of anything else, as a snail from its shell, as a snail's horns from its head; anything opening; any stream of water running, any stream running, any stream spurting, any stream spouting; any cry, any soft cry, any grunt; anything going into anything else, as a hand searching in a purse; anything clutching, anything grasping; anything rising, anything tightening or filling, as a sail; anything dripping, anything hardening, anything softening.
</p>
